<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sneha Agrawal | AI Expense Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#0f172a;color:#e2e8f0}
.container{max-width:900px;margin:auto;padding:30px}
h1{text-align:center;margin-bottom:20px}
.card{background:#1e293b;padding:20px;border-radius:12px;margin-bottom:20px}
.input-group{display:flex;gap:10px;flex-wrap:wrap}
input,select{padding:10px;border-radius:6px;border:none}
button{padding:10px 15px;border:none;border-radius:6px;background:#38bdf8;cursor:pointer}
.transaction{display:flex;justify-content:space-between;align-items:center;margin-top:10px;background:#0f172a;padding:10px;border-radius:8px}
.summary{display:flex;justify-content:space-between;margin-top:10px}
.insight{color:#38bdf8;margin-top:10px}
canvas{margin-top:20px}
</style>
</head>

<body>
<div class="container">

<h1>💰 AI Expense Tracker</h1>

<div class="card">
<div class="input-group">
<input id="desc" placeholder="e.g. Zomato dinner">
<input id="amount" type="number" placeholder="Amount">
<select id="type">
<option value="expense">Expense</option>
<option value="income">Income</option>
</select>
<button onclick="addTransaction()">Add</button>
</div>
</div>

<div class="card summary">
<p>Balance: ₹<span id="balance">0</span></p>
<p>Income: ₹<span id="inc">0</span></p>
<p>Expense: ₹<span id="exp">0</span></p>
</div>

<div class="card">
<h3>Transactions</h3>
<div id="list"></div>
</div>

<div class="card">
<h3>AI Insights</h3>
<p id="insight" class="insight"></p>
</div>

<div class="card">
<h3>Spending Chart</h3>
<canvas id="chart"></canvas>
</div>

</div>

<script>
let transactions = JSON.parse(localStorage.getItem("data")) || [];
let chart;

// SIMPLE AI CATEGORY (upgradeable to API later)
function detectCategory(desc){
  desc = desc.toLowerCase();
  if(desc.includes("food")||desc.includes("zomato")||desc.includes("swiggy")) return "Food";
  if(desc.includes("rent")) return "Rent";
  if(desc.includes("travel")||desc.includes("uber")) return "Travel";
  return "Other";
}

function addTransaction(){
let desc=document.getElementById("desc").value;
let amount=document.getElementById("amount").value;
let type=document.getElementById("type").value;

if(!desc||!amount){alert("Fill all fields");return}

let obj={id:Date.now(),desc,amount:Number(amount),type,category:detectCategory(desc)};
transactions.push(obj);
localStorage.setItem("data",JSON.stringify(transactions));

document.getElementById("desc").value="";
document.getElementById("amount").value="";
show();
}

function deleteTransaction(id){
transactions=transactions.filter(t=>t.id!==id);
localStorage.setItem("data",JSON.stringify(transactions));
show();
}

function generateInsights(income,expense){
if(expense===0) return "No expenses yet.";
let ratio=Math.round((expense/(income+expense))*100);
return `You are spending ${ratio}% of your total flow.`;
}

function updateChart(data){
let ctx=document.getElementById('chart');
let categoryTotals={};

transactions.forEach(t=>{
if(t.type==='expense'){
categoryTotals[t.category]=(categoryTotals[t.category]||0)+t.amount;
}
});

let labels=Object.keys(categoryTotals);
let values=Object.values(categoryTotals);

if(chart) chart.destroy();

chart=new Chart(ctx,{
type:'pie',
data:{labels:labels,datasets:[{data:values}]}
});
}

function show(){
let list=document.getElementById("list");
let balance=0,income=0,expense=0;
list.innerHTML="";

transactions.forEach(t=>{
if(t.type==="income"){balance+=t.amount;income+=t.amount}
else{balance-=t.amount;expense+=t.amount}

list.innerHTML+=`
<div class="transaction">
<span>${t.desc} (${t.category})</span>
<span style="color:${t.type==='income'?'#22c55e':'#ef4444'}">₹${t.amount}</span>
<button onclick="deleteTransaction(${t.id})">X</button>
</div>`;
});

document.getElementById("balance").innerText=balance;
document.getElementById("inc").innerText=income;
document.getElementById("exp").innerText=expense;
document.getElementById("insight").innerText=generateInsights(income,expense);
updateChart();
}

show();
</script>

</body>
</html>
