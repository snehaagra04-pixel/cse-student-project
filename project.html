<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<style>
:root{
    --primary:#2563eb;
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
}

body.dark{
    --bg:#0f172a;
    --card:#111827;
    --text:#f9fafb;
    --muted:#9ca3af;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,system-ui,sans-serif;
}

body{
    background:var(--bg);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:var(--text);
    transition:.3s;
}

.app{
    width:100%;
    max-width:480px;
    background:var(--card);
    border-radius:20px;
    box-shadow:0 20px 40px rgba(0,0,0,.12);
    padding:28px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.header h1{
    font-size:22px;
    font-weight:600;
}

.toggle{
    cursor:pointer;
    font-size:14px;
    color:var(--primary);
}

.form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form input,
.form select{
    padding:12px;
    border-radius:10px;
    border:1px solid #e5e7eb;
    font-size:14px;
    background:transparent;
    color:var(--text);
}

.form button{
    grid-column:1/-1;
    padding:14px;
    background:var(--primary);
    color:#fff;
    border:none;
    border-radius:12px;
    font-size:15px;
    cursor:pointer;
}

.form button:hover{
    opacity:.9;
}

.total{
    margin:22px 0 14px;
    padding:16px;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:#fff;
    border-radius:14px;
    font-size:18px;
    font-weight:500;
}

.list{
    list-style:none;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(0,0,0,.03);
    padding:14px;
    border-radius:12px;
    margin-bottom:10px;
}

body.dark .item{
    background:rgba(255,255,255,.05);
}

.item small{
    color:var(--muted);
    font-size:12px;
}

.delete{
    background:#ef4444;
    border:none;
    color:#fff;
    padding:6px 10px;
    border-radius:8px;
    cursor:pointer;
}

/* Mobile */
@media(max-width:480px){
    .form{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="app">
    <div class="header">
        <h1>Expense Tracker</h1>
        <div class="toggle" onclick="toggleDark()">Dark mode</div>
    </div>

    <div class="form">
        <input id="name" placeholder="Expense name">
        <input id="amount" type="number" placeholder="Amount ₹">
        <select id="category">
            <option value="">Category</option>
            <option>Food</option>
            <option>Rent</option>
            <option>Travel</option>
            <option>Shopping</option>
        </select>
        <input id="date" type="date">
        <button onclick="addExpense()">Add Expense</button>
    </div>

    <div class="total">
        Total Expense: ₹ <span id="total">0</span>
    </div>

    <ul class="list" id="list"></ul>
</div>

<script>
let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

function render(){
    const list = document.getElementById("list");
    let total = 0;
    list.innerHTML = "";

    expenses.forEach((e,i)=>{
        total += e.amount;
        list.innerHTML += `
            <li class="item">
                <div>
                    <strong>${e.name}</strong><br>
                    <small>${e.category} • ${e.date}</small>
                </div>
                <div>
                    ₹${e.amount}
                    <button class="delete" onclick="removeExpense(${i})">×</button>
                </div>
            </li>
        `;
    });

    document.getElementById("total").innerText = total;
}

function addExpense(){
    const name = document.getElementById("name").value;
    const amount = +document.getElementById("amount").value;
    const category = document.getElementById("category").value;
    const date = document.getElementById("date").value;

    if(!name || !amount || !category || !date){
        alert("Fill all fields");
        return;
    }

    expenses.push({name,amount,category,date});
    localStorage.setItem("expenses",JSON.stringify(expenses));
    render();

    name.value=amount.value=category.value=date.value="";
}

function removeExpense(i){
    expenses.splice(i,1);
    localStorage.setItem("expenses",JSON.stringify(expenses));
    render();
}

function toggleDark(){
    document.body.classList.toggle("dark");
}

render();
</script>

</body>
</html>
